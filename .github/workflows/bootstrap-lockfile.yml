name: Bootstrap lockfile

on:
  push:
    branches:
      - fix/deterministic-lockfile

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/fix/deterministic-lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove bootstrap workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/bootstrap-lockfile.yml
          git add package-lock.json .github/workflows/bootstrap-lockfile.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: add deterministic npm lockfile"
          git push
